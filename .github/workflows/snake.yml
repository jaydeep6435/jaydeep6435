name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily at midnight UTC
  workflow_dispatch:       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: jaydeep6435
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23AD1457&color_dots=%23FCE4EC,%23F8BBD0,%23F48FB1,%23F06292,%23EC407A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF69B4&color_dots=%232B1720,%234A1F2E,%237A2E48,%23AE3E64,%23D6336C

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
